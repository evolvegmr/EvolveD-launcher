plugins {
    id 'com.android.application' version '8.7.2'
}

static def hasGoogleServicesConfig(Project project) {
    def candidates = [
        new File(project.projectDir, 'google-services.json'),
        new File(project.projectDir, 'src/debug/google-services.json'),
        new File(project.projectDir, 'src/release/google-services.json'),
        new File(project.projectDir, 'src/google-services.json')
    ]
    return candidates.any { it.exists() }
}

if (hasGoogleServicesConfig(project)) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle('BUILD: Firebase Google Services config detected; optional Firebase features enabled.')
} else {
    logger.lifecycle('BUILD: No google-services.json detected; Firebase remains optional and disabled.')
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // EvolveD Launcher public release line. Keep this stable so GitHub
    // Releases can be compared against exactly 1.0.0 without git metadata.
    return "1.0.0"
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "";
}

def releaseSigningProperties = [
        "signingKeystore",
        "signingStorePassword",
        "signingKeyAlias",
        "signingKeyPassword"
]
def releaseSigningConfigured = releaseSigningProperties.every { project.hasProperty(it) } &&
        new File(project.property("signingKeystore").toString()).isFile()
if (!releaseSigningConfigured) {
    logger.warn("BUILD: No release signing properties found; release APKs will be unsigned.")
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 34

    sourceSets {
        main.res.srcDir(layout.buildDirectory.dir("generated/evolvedLauncher/res"))
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (releaseSigningConfigured) {
                storeFile file(project.property("signingKeystore"))
                storePassword project.property("signingStorePassword")
                keyAlias project.property("signingKeyAlias")
                keyPassword project.property("signingKeyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "com.cslaucher.plus"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1000000
        versionName getVersionName()
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }

        // ── APK slimming ────────────────────────────────────────────────
        // x86 / x86_64 only exist for emulators and a handful of Chromebooks, yet they cost
        // ~60 MB of the release APK (native libs + LWJGL natives + the x86 JRE tarballs).
        // Build with -PkeepX86=true to put them back.
        if (!(project.findProperty("keepX86") ?: "false").toBoolean()) {
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "EvolveD Launcher"
            resValue "string", "app_short_name", "EvolveD Launcher"
            resValue 'string', 'application_package', 'com.cslaucher.plus.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.cslaucher.plus.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.cslaucher.plus.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Do not enable minification — it obfuscates java.awt classes.
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // defaultConfig already set
            // multiDexEnabled = true
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            resValue "string", "app_name", "EvolveD Launcher"
            resValue "string", "app_short_name", "EvolveD Launcher"
            resValue 'string', 'storageProviderAuthorities', 'com.cslaucher.plus.gamefolder'
            resValue 'string', 'application_package', 'com.cslaucher.plus'
        }
        gplay {
            initWith release
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        doNotStrip += [
                "**/libcutils.so"
        ]
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '34.0.0'
}

def evolvedLogoFile = rootProject.file('EvolveD.png')
def generatedEvolvedResources = layout.buildDirectory.dir('generated/evolvedLauncher/res')

tasks.register('generateEvolvedLauncherIcons') {
    inputs.file(evolvedLogoFile)
    outputs.dir(generatedEvolvedResources)

    doLast {
        if (!evolvedLogoFile.isFile()) {
            throw new GradleException("The canonical launcher logo is missing: ${evolvedLogoFile}")
        }

        def source = javax.imageio.ImageIO.read(evolvedLogoFile)
        if (source == null || source.width <= 0 || source.height <= 0) {
            throw new GradleException("The canonical launcher logo is not a readable image: ${evolvedLogoFile}")
        }

        def resourceRoot = generatedEvolvedResources.get().asFile
        def savePng = { java.awt.image.BufferedImage image, File destination ->
            destination.parentFile.mkdirs()
            if (!javax.imageio.ImageIO.write(image, 'png', destination)) {
                throw new GradleException("Could not write generated launcher icon: ${destination}")
            }
        }
        def resize = { java.awt.image.BufferedImage input, int width, int height ->
            def image = new java.awt.image.BufferedImage(
                    width, height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = image.createGraphics()
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            graphics.drawImage(input, 0, 0, width, height, null)
            graphics.dispose()
            image
        }

        def logoResource = new File(resourceRoot, 'drawable/evolved_icon.png')
        logoResource.parentFile.mkdirs()
        java.nio.file.Files.copy(evolvedLogoFile.toPath(), logoResource.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)

        def adaptiveCanvas = new java.awt.image.BufferedImage(
                512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def adaptiveGraphics = adaptiveCanvas.createGraphics()
        adaptiveGraphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        adaptiveGraphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        int adaptiveSize = 336
        int left = (512 - adaptiveSize) / 2
        int top = (512 - adaptiveSize) / 2
        adaptiveGraphics.drawImage(source, left, top, left + adaptiveSize,
                top + adaptiveSize, 0, 0, source.width, source.height, null)
        adaptiveGraphics.dispose()
        savePng(adaptiveCanvas,
                new File(resourceRoot, 'drawable-nodpi/evolved_icon_adaptive.png'))

        [
                'mipmap-mdpi'   : 48,
                'mipmap-hdpi'   : 72,
                'mipmap-xhdpi'  : 96,
                'mipmap-xxhdpi' : 144,
                'mipmap-xxxhdpi': 192
        ].each { density, size ->
            def icon = resize(source, size, size)
            ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'].each { name ->
                savePng(icon, new File(resourceRoot, "${density}/${name}"))
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateEvolvedLauncherIcons')
}

afterEvaluate {
    // Explicit dependencies for which the apk relies on
    tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":methods_injector_agent:jar", ":jre_lwjgl3glfw:jar")
    tasks.mergeReleaseAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":methods_injector_agent:jar", ":jre_lwjgl3glfw:jar")
}

